[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/php-fpm.out
stderr_logfile=/var/log/supervisor/php-fpm.err

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/nginx.out
stderr_logfile=/var/log/supervisor/nginx.err

[program:queue-worker]
command=php /var/www/html/artisan queue:work --queue=fbr,notifications,imports,default --tries=5 --sleep=2 --max-time=3600
autostart=true
autorestart=true
numprocs=2
process_name=%(program_name)s_%(process_num)02d
user=www-data
stdout_logfile=/var/log/supervisor/queue.out
stderr_logfile=/var/log/supervisor/queue.err
stopwaitsecs=3600

[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/supervisor/scheduler.out
stderr_logfile=/var/log/supervisor/scheduler.err
