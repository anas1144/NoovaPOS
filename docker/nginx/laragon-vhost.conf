# =============================================================================
# NoovaPOS — Laragon Nginx Virtual Host
# =============================================================================
#
# SETUP INSTRUCTIONS (do this once in Laragon):
#
# 1. Open Laragon > Menu > Nginx > sites-enabled
#    (or go to C:\laragon\etc\nginx\sites-enabled\)
#
# 2. Create a new file: noovapos.local.conf
#    Copy the server block below into it.
#
# 3. Open your Windows HOSTS file as Administrator:
#    C:\Windows\System32\drivers\etc\hosts
#    Add these lines (add more tenant subdomains as you create them):
#
#    127.0.0.1  noovapos.local
#    127.0.0.1  superadmin.noovapos.local
#    # Add a line for every tenant you register:
#    # 127.0.0.1  acme.noovapos.local
#    # 127.0.0.1  resto.noovapos.local
#
#    TIP: Install "Acrylic DNS Proxy" for true wildcard *.noovapos.local
#    resolution so you never need to edit hosts again.
#    https://mayakron.altervista.org/support/acrylic/Home.htm
#
# 4. Restart Laragon (Menu > Restart All Services)
#
# =============================================================================

server {
    listen 80;

    # Handle the main domain AND all subdomains with one vhost
    server_name noovapos.local *.noovapos.local;

    root "D:/laragon/www/noovapos/public";
    index index.php index.html;

    client_max_body_size 100M;

    # Compiled JS/CSS/images — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Service worker — no cache
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # All requests → Laravel (handles both landing page and React SPA)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM (Laragon default socket)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass "127.0.0.1:9000";
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        # Pass the Host header so Laravel knows which subdomain this is
        fastcgi_param HTTP_HOST $host;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
