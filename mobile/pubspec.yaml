name: noovapos_mobile
description: NoovaPOS mobile app (offline-first POS, attendance, delivery).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  sqflite: ^2.3.3
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  mobile_scanner: ^5.1.1
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^11.3.1
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
